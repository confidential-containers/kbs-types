[package]
name = "kbs-types"
description = "Rust (de)serializable types for KBS"
version = "0.18.0"
authors = ["Sergio Lopez <slp@redhat.com>"]
edition = "2021"
repository = "https://github.com/virtee/kbs-types"
license = "Apache-2.0"

[features]
default = [ "std" ]
alloc = ["base64/alloc",  "serde/alloc", "serde_json/alloc" ]
# `std` keeps the openssl backend.
std = ["base64/std", "serde/std", "serde_json/std", "strum/std", "thiserror/std", "openssl"]

# Crypto backend for `HashAlgorithm::digest`.
# `rust-crypto` uses the pure-Rust `sha2`/`sm3` crates when enabled, always overrides OpenSSL as the digest implementation.
openssl = ["dep:openssl"]
rust-crypto = ["dep:sha2", "dep:sm3"]

[dependencies]
base64 = { version = "0.22.1", default-features = false }
openssl = { version = "0.10", optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
sm3 = { version = "0.4", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
strum = { version = "0.27", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.3", default-features = false }
